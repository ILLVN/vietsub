<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ILLIT Vietsub | ILLVN Subteam</title>
    <meta name="description"
        content="Xem video ILLIT với phụ đề tiếng Việt, được cập nhật liên tục bởi ILLVN Subteam." />
    <link rel="icon" href="favicon.ico" />

    <style>
        :root {
            --primary: #ff2d55;
            --bg: #0b0b0b;
            --sidebar: #151515;
            --card: #202020;
            --border: #303030;
            --text: #ffffff;
            --muted: #aaaaaa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: "Roboto", sans-serif;
            font-weight: 500;
        }

        body {
            display: flex;
        }

        #sidebar {
            width: 360px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 18px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .app-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .search-box input {
            width: 100%;
            height: 44px;
            background: #242424;
            border: 1px solid #333;
            border-radius: 12px;
            outline: none;
            padding: 0 14px;
            color: white;
            font-size: 14px;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .tabs-header {
            display: flex;
            background: #111;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            position: relative;
            padding: 6px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 8px;
            position: relative;
            z-index: 2;
            transition: color 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn:hover {
            color: white;
        }

        .tab-btn.active {
            color: var(--primary);
        }

        .tabs-header::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 6px;
            width: calc(50% - 8px);
            height: calc(100% - 12px);
            background: rgba(255, 45, 85, 0.08);
            border: 1px solid rgba(255, 45, 85, 0.2);
            border-radius: 8px;
            z-index: 1;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tabs-header.slide-active::after {
            transform: translateX(calc(100% + 4px));
        }

        .tabs-content {
            flex: 1;
            overflow: hidden;
            display: flex;
            width: 200%;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tabs-content.slide-active {
            transform: translateX(-50%);
        }

        .tab-pane {
            width: 50%;
            height: 100%;
            overflow-y: auto;
            padding: 14px;
            flex-shrink: 0;
            opacity: 0.3;
            transform: scale(0.98);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .tab-pane.active {
            opacity: 1;
            transform: scale(1);
        }

        .tab-pane::-webkit-scrollbar {
            width: 7px;
        }

        .tab-pane::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 999px;
        }

        .category-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
            margin: 14px 0 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .category-wrapper:first-child .category-title {
            margin-top: 5px;
        }

        .video-item {
            display: flex;
            gap: 12px;
            background: var(--card);
            border: 1px solid transparent;
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            margin-bottom: 12px;
            transition: .2s;
        }

        .video-item:hover {
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .video-item.active {
            border-color: var(--primary);
            background: rgba(255, 45, 85, .12);
        }

        .video-thumb {
            width: 130px;
            height: 74px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .video-content {
            padding: 10px 10px 10px 0;
            display: flex;
            align-items: center;
        }

        .video-title {
            font-size: 13px;
            line-height: 1.45;
            color: white;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .player-box {
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 16 / 9;
            position: relative;
            background: black;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 70px rgba(0, 0, 0, .7);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #sub-container {
            position: absolute;
            left: 5%;
            right: 5%;
            bottom: 8%;
            text-align: center;
            z-index: 2147483647;
            pointer-events: none;
        }

        #sub-text {
            background: rgba(0, 0, 0, .82);
            color: white;
            font-size: clamp(17px, 2.5vw, 32px);
            line-height: 1.5;
            display: inline-block;
            padding: 8px 14px;
            border-radius: 5px;
            text-shadow: 2px 2px 4px black;
            white-space: pre-wrap;
            max-width: 90%;
        }

        #custom-fs-btn {
            position: absolute;
            right: 13px;
            bottom: 13px;
            z-index: 40;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 22px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            opacity: 1;
            transition: transform .2s;
        }

        #custom-fs-btn:hover {
            background: rgba(0, 0, 0, .4);
            transform: scale(1.05);
        }

        .player-box:fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            aspect-ratio: auto;
            border-radius: 0;
        }

        .player-box:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            border-radius: 0;
        }

        #now-playing {
            margin-top: 18px;
            color: #bbb;
            font-size: 15px;
            text-align: center;
            max-width: 900px;
            display: none;
        }

        #empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            margin-top: 24px;
            color: #aaa;
        }

        .empty-title {
            font-size: 24px;
            font-weight: 700;
            color: white;
            margin-bottom: 10px;
        }

        .empty-desc {
            font-size: 15px;
            color: #999;
            max-width: 420px;
            line-height: 1.6;
        }

        @media(max-width:900px) {
            body {
                flex-direction: column;
            }

            #sidebar {
                width: 100%;
                height: 48vh;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            #main-content {
                padding: 12px;
                justify-content: flex-start;
            }

            .player-box {
                border-radius: 14px;
            }

            .video-thumb {
                width: 120px;
                height: 68px;
            }

            .video-title {
                font-size: 12px;
            }

            #sub-container {
                bottom: 15px;
            }

            #sub-text {
                font-size: clamp(15px, 4vw, 22px);
                padding: 6px 10px;
            }
        }

        @media(max-width:600px) {
            #sidebar {
                height: 52vh;
            }

            .video-item {
                gap: 10px;
            }

            .video-thumb {
                width: 110px;
                height: 62px;
            }

            .video-title {
                -webkit-line-clamp: 2;
            }

            .player-box {
                border-radius: 10px;
            }

            #sub-container {
                bottom: 15px;
            }

            #sub-text {
                font-size: 15px;
                line-height: 1.4;
            }

            #empty-state {
                padding: 28px 12px;
            }

            .empty-title {
                font-size: 20px;
            }

            .empty-desc {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div id="sidebar">
        <div class="sidebar-header">
            <div class="app-title">ILLIT Vietsub</div>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Tìm video..." />
            </div>
        </div>

        <div class="tabs-header" id="tabs-nav">
            <button class="tab-btn active" id="btn-latest" onclick="switchTab('latest')">Mới nhất</button>
            <button class="tab-btn" id="btn-category" onclick="switchTab('category')">Danh mục</button>
        </div>

        <div class="tabs-content" id="tabs-container">
            <div class="tab-pane active" id="pane-latest"></div>
            <div class="tab-pane" id="pane-category"></div>
        </div>
    </div>

    <div id="main-content">
        <div id="empty-state">
            <div class="empty-title">◖|˶˘꒳˘˶|◗♪ᴵᵀˢ ᴹᴱ</div>
            <div class="empty-desc">Chọn một video từ playlist để bắt đầu xem</div>
        </div>
        <div class="player-box" id="full-player" style="display:none;">
            <div id="yt-frame"></div>
            <div id="sub-container">
                <span id="sub-text"></span>
            </div>
            <button id="custom-fs-btn">⛶</button>
        </div>
        <div id="now-playing"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let captions = [];
        let isPlaying = false;
        let animFrame;
        let videoData = { categories: [], videos: [] };
        let currentVideoId = null;
        let activeTab = 'latest';

        async function loadJson() {
            try {
                const response = await fetch("videos.json");
                const videoJson = await response.json();
                videoData = videoJson;

                renderCategoryTab(videoData);
                renderLatestTab(videoData);
                loadVideoFromHash();
            } catch (err) {
                console.error("Không load được json", err);
            }
        }

        function switchTab(tabName) {
            activeTab = tabName;
            const nav = document.getElementById('tabs-nav');
            const container = document.getElementById('tabs-container');
            const paneCategory = document.getElementById('pane-category');
            const paneLatest = document.getElementById('pane-latest');

            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            if (tabName === 'latest') {
                document.getElementById('btn-latest').classList.add('active');
                nav.classList.remove('slide-active');
                container.classList.remove('slide-active');

                paneLatest.classList.add('active');
                paneCategory.classList.remove('active');
            } else {
                document.getElementById('btn-category').classList.add('active');
                nav.classList.add('slide-active');
                container.classList.add('slide-active');

                paneCategory.classList.add('active');
                paneLatest.classList.remove('active');
            }
        }

        function renderCategoryTab(data) {
            const container = document.getElementById("pane-category");
            container.innerHTML = "";

            if (data.categories.length === 0 || data.videos.length === 0) {
                container.innerHTML = `<div style="text-align:center;padding:20px;color:var(--muted);font-size:14px;">Không tìm thấy video</div>`;
                return;
            }

            data.categories.forEach(cat => {
                const filteredVideos = data.videos.filter(v => v.category === cat);
                if (filteredVideos.length > 0) {
                    const wrapper = document.createElement("div");
                    wrapper.className = "category-wrapper";

                    const title = document.createElement("div");
                    title.className = "category-title";
                    title.innerText = cat;
                    wrapper.appendChild(title);

                    filteredVideos.forEach(video => {
                        const item = createVideoDOM(video);
                        wrapper.appendChild(item);
                    });
                    container.appendChild(wrapper);
                }
            });
        }

        function renderLatestTab(data) {
            const container = document.getElementById("pane-latest");
            container.innerHTML = "";

            if (data.videos.length === 0) {
                container.innerHTML = `<div style="text-align:center;padding:20px;color:var(--muted);font-size:14px;">Không tìm thấy video</div>`;
                return;
            }

            data.videos.forEach(video => {
                const item = createVideoDOM(video);
                container.appendChild(item);
            });
        }

        function createVideoDOM(video) {
            const item = document.createElement("div");
            item.className = `video-item v-id-${video.id}`;
            if (currentVideoId && currentVideoId === video.id) {
                item.classList.add("active");
            }
            item.innerHTML = `
                <img class="video-thumb" src="${video.thumb}" alt="">
                <div class="video-content">
                    <div class="video-title">${video.title}</div>
                </div>
            `;
            item.onclick = () => {
                location.hash = video.id;
            };
            return item;
        }

        function syncActiveState(id) {
            document.querySelectorAll(".video-item").forEach(v => v.classList.remove("active"));
            document.querySelectorAll(`.v-id-${id}`).forEach(v => v.classList.add("active"));
        }

        function loadVideoFromHash() {
            const id = location.hash.replace("#", "").trim();
            if (!id || !videoData.videos) return;

            const targetVideo = videoData.videos.find(v => v.id === id);
            if (targetVideo) {
                loadVideo(targetVideo);
            }
        }

        document.getElementById("search-input").addEventListener("input", function () {
            const keyword = this.value.trim().toLowerCase();

            if (!keyword) {
                renderCategoryTab(videoData);
                renderLatestTab(videoData);
                if (currentVideoId) syncActiveState(currentVideoId);
                return;
            }

            const filteredData = {
                categories: videoData.categories,
                videos: videoData.videos.filter(v => v.title.toLowerCase().includes(keyword))
            };

            renderCategoryTab(filteredData);
            renderLatestTab(filteredData);
            if (currentVideoId) syncActiveState(currentVideoId);
        });

        function onYouTubeIframeAPIReady() {
            loadJson();
        }

        function loadVideo(video) {
            currentVideoId = video.id;
            syncActiveState(video.id);

            document.getElementById("empty-state").style.display = "none";
            document.getElementById("full-player").style.display = "block";

            const nowPlaying = document.getElementById("now-playing");
            nowPlaying.style.display = "block";
            nowPlaying.innerText = video.title;

            if (!player) {
                player = new YT.Player("yt-frame", {
                    height: "100%",
                    width: "100%",
                    videoId: video.id,
                    playerVars: {
                        controls: 1,
                        disablekb: 0,
                        rel: 0,
                        modestbranding: 1,
                        fs: 0
                    },
                    events: {
                        onStateChange: onPlayerStateChange,
                        onReady: () => {
                            restoreVideoTime(video.id);
                        }
                    }
                });
            } else {
                player.loadVideoById(video.id);
                setTimeout(() => {
                    restoreVideoTime(video.id);
                }, 1000);
            }

            fetch(video.sub)
                .then(r => r.text())
                .then(text => {
                    captions = parseVTT(text);
                })
                .catch(() => {
                    captions = [];
                });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                cancelAnimationFrame(animFrame);
                updateLoop();
            } else {
                isPlaying = false;
                cancelAnimationFrame(animFrame);
            }
        }

        function updateLoop() {
            if (!player || !isPlaying) return;
            const current = player.getCurrentTime();
            const sub = captions.find(s => current >= s.start && current <= s.end);
            const subText = document.getElementById("sub-text");
            const subContainer = document.getElementById("sub-container");

            if (sub) {
                if (subText.innerText !== sub.text) {
                    subText.innerText = sub.text;
                }
                if (subContainer.style.display !== "block") {
                    subContainer.style.display = "block";
                }
            } else {
                if (subContainer.style.display !== "none") {
                    subText.innerText = "";
                    subContainer.style.display = "none";
                }
            }

            animFrame = requestAnimationFrame(updateLoop);

            const duration = player.getDuration();
            if (duration && current >= duration - 10) {
                localStorage.removeItem("video-progress-" + currentVideoId);
            }
        }

        function timeToSec(str) {
            if (!str) return 0;
            const parts = str.trim().replace(",", ".").split(":");
            return parts.length === 3
                ? (+parts[0]) * 3600 + (+parts[1]) * 60 + parseFloat(parts[2])
                : (+parts[0]) * 60 + parseFloat(parts[1]);
        }

        function parseVTT(data) {
            const result = [];
            const blocks = data.replace(/\r/g, "").split("\n\n");
            blocks.forEach(block => {
                const lines = block.split("\n").map(v => v.trim()).filter(Boolean);
                const timeLine = lines.find(line => line.includes("-->"));
                if (!timeLine) return;
                const times = timeLine.split("-->");
                let text = lines.slice(lines.indexOf(timeLine) + 1).join("\n").trim();
                text = text.replace(/<[^>]+>/g, "").replace(/^•\s*/gm, "").trim();
                if (!text) return;
                result.push({
                    start: timeToSec(times[0]),
                    end: timeToSec(times[1]),
                    text: text
                });
            });
            return result;
        }

        function restoreVideoTime(videoId) {
            if (!player) return;
            const saved = localStorage.getItem("video-progress-" + videoId);
            if (!saved) return;
            const time = parseFloat(saved);
            if (!isNaN(time) && time > 3) {
                player.seekTo(time, true);
            }
        }

        document.getElementById("custom-fs-btn").onclick = async () => {
            const box = document.getElementById("full-player");
            if (!document.fullscreenElement) {
                await box.requestFullscreen();
                if (screen.orientation && screen.orientation.lock) {
                    try {
                        await screen.orientation.lock("landscape");
                    } catch (e) { }
                }
            } else {
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
                await document.exitFullscreen();
            }
        };

        setInterval(() => {
            if (player && currentVideoId && typeof player.getCurrentTime === "function" && isPlaying) {
                const current = player.getCurrentTime();
                localStorage.setItem("video-progress-" + currentVideoId, current);
            }
        }, 3000);

        window.addEventListener("hashchange", loadVideoFromHash);
    </script>
</body>

</html>
